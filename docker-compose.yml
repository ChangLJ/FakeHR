services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hr-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      DATABASE_PATH: /app/data/humanresource.db
      Jwt__Secret: HumanResource-Docker-JWT-Secret-Key-Change-In-Production-32chars!
      Cors__Origins__0: http://localhost:5174
      Cors__Origins__1: http://localhost:3000
      Cors__Origins__2: http://frontend:80
    ports:
      - "5001:8080"
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hr-frontend
    ports:
      - "5174:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  sqlite_data:
